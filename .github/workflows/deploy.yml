name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate static site files
        run: |
          set -e
          test -f index.html
          test -f css/portfolio.css
          test -s index.html
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'css/portfolio.css' index.html
          echo "Static portfolio structure OK"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Static site — no build step
        run: |
          echo "This repo is a static HTML/CSS site; there is no npm or bundler build."
          echo "GitHub Pages serves files from the repository root after push to main."

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment notification
        run: |
          echo "All checks passed."
          echo "If GitHub Pages is set to deploy from branch main (root), your site updates on push."
